# The Tiiny Control Panel on an always-on machine: a home server, a NAS or a Raspberry Pi (Linux).
#   Easiest:  docker/setup.sh sets this up (with .env), starts it, and shows the address and setup code.
#   By hand:  docker compose up -d, then: docker exec tiiny-panel tiiny-panel info
#             (the address to open, and the setup code to type there; it's also in tiiny-data/setup-code.txt)
#   Update:   docker compose pull && docker compose up -d
# More in the user guide: docs/USER_GUIDE.md, "Run it on a home server".
services:
  tiiny-panel:
    image: ghcr.io/0xstian/tiiny-control-panel:latest
    container_name: tiiny-panel
    # Host networking: the panel can find your Tiiny on the network, reach it over USB-C, and your devices reach the
    # panel at this machine's address (port 8765; apps use 8766).
    network_mode: host
    restart: unless-stopped
    init: true
    volumes:
      - ./tiiny-data:/data:z        # chats, settings, signed-in devices, and Tiiny's tool with its config
                                    # (:z lets the container use it where SELinux is on, like Fedora; ignored elsewhere)
      # - /home/you/code:/projects:ro   # folders for code reviews and projects (they show up under /projects;
                                        # with SELinux, use :ro,z)
    environment:
      # Your user, group and time zone: docker/setup.sh writes them into .env next to this file. Without it, the
      # defaults below apply; change them here or in .env (run `id` to see your user and group).
      - PUID=${PUID:-1000}          # the user and group that own ./tiiny-data
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}           # your time zone, for example Europe/Oslo: routines run on this clock
      - TIINY_UI_PORT=${TIINY_UI_PORT:-8765}
      # - TIINY_UI_PUBLIC_NAMES=box.example        # other names for this machine (IP addresses and its own name always work)
      # - TIINY_UI_PUBLIC_URL=https://nas.local:8765   # the address in sign-in links
      # HTTPS is on by default, with a certificate the panel makes itself (each browser warns once). To use your own
      # certificate instead (no warning on devices that trust it):
      # - TIINY_UI_TLS_CERT=/data/tls/cert.pem
      # - TIINY_UI_TLS_KEY=/data/tls/key.pem
    # command: ["--allow-commands"]   # let the agent run commands and change files (inside this container only)
