<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tiiny Control Panel</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101014;
      color: #e8e8ec;
      font: 15px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
    }
    .box { text-align: center; padding: 24px; }
    .logo { font-size: 44px; line-height: 1; }
    h1 { font-size: 20px; font-weight: 600; margin: 14px 0 6px; }
    .spin {
      width: 22px; height: 22px; margin: 18px auto 0;
      border: 3px solid #2c2c34; border-top-color: #e8e8ec;
      border-radius: 50%;
      animation: rot 0.9s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
    #msg { color: #9a9aa3; font-size: 13.5px; max-width: 46ch; margin: 18px auto 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">◍</div>
    <h1>Tiiny Control Panel</h1>
    <div class="spin" id="spin"></div>
    <p id="msg">Starting your panel… the first start takes a few seconds.</p>
  </div>
</body>
</html>
